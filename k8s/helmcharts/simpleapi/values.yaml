# Default values for simpleapi.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: duran750/k8s-iac
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 2000
  seccompProfile:
    type: RuntimeDefault
  # fsGroup: 2000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

service:
  type: NodePort
  port: 80
  nodePort: 30000

# Routing is handled by Gateway API (HTTPRoute) instead of Ingress.
# See k8s/gateway/gateway.yaml.

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 300m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 30
  targetCPUUtilizationPercentage: 20
  targetMemoryUtilizationPercentage: 20

nodeSelector: {}

tolerations: []

affinity: {}
