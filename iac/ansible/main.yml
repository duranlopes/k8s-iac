---
- name: Prepare Kubernetes nodes
  hosts: k8s
  become: true
  gather_facts: true
  roles:
    - role: install-k8s
      tags:
        - install
        - install-k8s

- name: Initialize the Kubernetes control plane
  hosts: k8s-master
  become: true
  gather_facts: true
  roles:
    - role: create-cluster
      tags:
        - cluster
        - control-plane

- name: Join Kubernetes workers
  hosts: k8s-workers
  become: true
  gather_facts: true
  roles:
    - role: join-workers
      tags:
        - cluster
        - workers

- name: Install Helm and cluster add-ons
  hosts: k8s-master
  become: true
  gather_facts: true
  roles:
    - role: install-helm
      tags:
        - addons
        - helm
    - role: k8s-features
      tags:
        - addons
        - features
