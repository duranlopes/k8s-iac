---
kubernetes_kubeconfig: /etc/kubernetes/admin.conf

# Gateway API CRDs (standard channel).
gateway_api_crd_url: https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.1/standard-install.yaml

k8s_features_helm_repositories:
  - name: metrics-server
    url: https://kubernetes-sigs.github.io/metrics-server/
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts

# Envoy Gateway implements the Kubernetes Gateway API.
envoy_gateway_namespace: envoy-gateway-system
envoy_gateway_release_name: envoy-gateway
envoy_gateway_chart: oci://docker.io/envoyproxy/gateway-helm
envoy_gateway_chart_version: v1.9.1

# Gateway resource created after the controller is running.
gateway_manifest_path: "{{ playbook_dir }}/../../k8s/gateway/gateway.yaml"

metrics_namespace: kube-system
metrics_release_name: metrics-server
metrics_chart: metrics-server/metrics-server

monitoring_namespace: monitoring
monitoring_release_name: kube-prometheus-stack
monitoring_chart: prometheus-community/kube-prometheus-stack
